<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Cibulka: Boj Za Pravdu!</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:'Courier New',monospace;display:flex;justify-content:center;align-items:center;flex-direction:column;min-height:100vh;overflow:hidden}
h1{color:#ffcc00;text-shadow:2px 2px #ff0000;text-transform:uppercase;font-size:1.3rem;margin:6px 0}
canvas{border:4px solid #ff0000;background:#000;display:block}
#hud{display:flex;justify-content:space-between;width:800px;padding:5px 10px;background:#111;border:2px solid #ff0000;border-top:none;font-size:12px}
#hud div{padding:2px 6px}
.lives{color:#ff4444}.hbar{color:#00ff00}.sc{color:#ffcc00}
.obj{color:#aaa;border-left:2px solid #ffcc00;padding-left:10px;max-width:340px;font-size:11px}
#ctr{color:#666;font-size:11px;margin-top:4px}
</style>
</head>
<body>
<h1>Cibulka: Boj Za Pravdu!</h1>
<canvas id="gc" width="800" height="600"></canvas>
<div id="hud">
<div class="lives" id="hl">&#9829;&#9829;&#9829;</div>
<div class="hbar" id="hh">ZDRAVI: 100%</div>
<div class="sc" id="hs">SKORE: 0</div>
<div class="obj" id="ho">-</div>
</div>
<div id="ctr">SIPKY: pohyb | MEZERN&Iacute;K: skok | E: interakce | K: Siderick&eacute; Kyvadlo</div>
<script>
"use strict";
const C=document.getElementById('gc'),X=C.getContext('2d'),W=800,H=600;

// === INPUT ===
const K={},JP={};
window.addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(!K[e.code])JP[e.code]=true;K[e.code]=true});
window.addEventListener('keyup',e=>{K[e.code]=false});
function ck(c){if(JP[c]){JP[c]=false;return true}return false}

// === GAME STATE ===
let st='menu',lv=0,lives=3,score=0,fr=0;
let P={},cam={x:0},plats=[],ens=[],npcs=[],its=[],exs=[],hzs=[],projs=[],parts=[];
let obj={t:'',d:false},hasKyv=false,dq=[],cd=null,kvs=null,lvW=W,dtmr=0,letmr=0;
const GR=0.6,PS=4,JV=-11.5;

// === HELPERS ===
function col(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function sp(x,y,c,n){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*6,vy:(Math.random()-1)*4,l:30+Math.random()*30,c,s:2+Math.random()*3})}
function updParts(){for(let i=parts.length-1;i>=0;i--){let p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.1;p.l--;if(p.l<=0)parts.splice(i,1)}}

// === DIALOG ===
function dlg(t,tx,cb){dq.push({t,tx,cb:cb||null});if(!cd)ndlg()}
function ndlg(){if(dq.length>0){cd=dq.shift();st='dialog'}else{cd=null;if(st==='dialog')st='playing'}}
function cdlg(){let cb=cd?cd.cb:null;cd=null;if(cb)cb();ndlg()}

// === KYVADLO ===
function tryKyv(){
if(!hasKyv||kvs)return;
let near=null,md=100;
npcs.forEach(n=>{if(n.rev||n.fled)return;let d=Math.abs(P.x+P.w/2-n.x-n.w/2)+Math.abs(P.y+P.h/2-n.y-n.h/2);if(d<md){md=d;near=n}});
if(near){kvs={tgt:near,tmr:120,res:near.isA};st='kyvadlo'}
else dlg("KYVADLO","Nikdo podezrely neni nablizku! Pribliz se k osobe a pak pouzij KYVADLO!")
}
function updKyv(){
if(!kvs)return;kvs.tmr--;
if(kvs.tmr<=0){
let n=kvs.tgt;n.rev=true;
if(n.isA){score+=200;sp(n.x+n.w/2,n.y,'#ff0000',15);n.fled=true;
const ls=["AGENT!!! Kyvadlo NIKDY NELZE! To je DUKAZ!","AHA!!! AGENT GRU! Vedel jsem to! KYVADLO je NEOMYLNE!!!","ODHALEN! Dalsi ZRADCE! Kyvadlo je GENIALNI NASTROJ!","TAK TY JSI AGENT?! Me kyvadlo te PROKOUKLO!","AGENT KGB!!! Ja to VEDEL! SIDERICKE KYVADLO nikdy NESELZE!!!"];
dlg("AGENT ODHALEN!!!",ls[Math.floor(Math.random()*ls.length)])}
else{const ls=["Hmm, cisty... ALE TO NEZNAMENA, ZE NEBUDE NAVERBOVAN!","Tentokrat cisty. Ale AGENTI jsou VSUDE! Nesmim POLEVIT!","Kyvadlo rika cisty. Dobre. Ale at si da POZOR!","Cisty... TENTOKRAT. Ale situace se muze KDYKOLI zmenit!"];
dlg("CISTY",ls[Math.floor(Math.random()*ls.length)])}
kvs=null;st='dialog';chkObj()}}

// === OBJECTIVE ===
function sObj(t){obj={t,d:false};document.getElementById('ho').textContent=t}
function chkObj(){
if(lv===0){
let ki=its.filter(i=>i.tp==='kyv'&&i.col).length;
let ni=npcs.filter(n=>n.rev).length;
if(ki>=1&&ni>=1&&!obj.d){obj.d=true;dlg("VYBORNE!","Zvladl jsi zaklady! Ted VPERED do ulic Prahy! AGENTI GRU se rozlezli VSUDE!")}
}else if(lv===1){
let ag=npcs.filter(n=>n.isA&&n.rev).length;
let si=its.filter(i=>i.tp==='sig'&&i.col).length;
let ls=its.filter(i=>i.tp==='loud'&&i.col).length;
if(ag>=2&&si>=3&&ls>=2&&!obj.d){obj.d=true;dlg("ULICE PROCISTENY!","Skvela prace! AGENTI ODHALENI, hlasy SEBR\u00c1NY, vysilace ZNICENY! Dal do REDAKCE!")}
}else if(lv===2){
let pr=its.filter(i=>i.tp==='press'&&i.col).length;
let dc=its.filter(i=>i.tp==='doc'&&i.col).length;
let mb=ens.filter(e=>e.tp==='mb'&&!e.al).length;
if(pr>=2&&dc>=2&&mb>=1&&!obj.d){obj.d=true;dlg("REDAKCE VYCIISTENA!","DEZINFORMACNI CENTRUM zniceno! Dukazy zajisteny! Pokracujeme na KARLUV MOST!")}
}else if(lv===3){
let ag=npcs.filter(n=>n.isA&&n.rev).length;
if(ag>=3&&!obj.d){obj.d=true;dlg("MOST JE CISTY!","Vsichni TRI AGENTI na moste ODHALENI! KYVADLO je NEOMYLNE! Pokracujeme do PARLAMENTU!")}
}else if(lv===4){
let dc=its.filter(i=>i.tp==='doc'&&i.col).length;
let jm=its.filter(i=>i.tp==='jam'&&i.col).length;
if(dc>=3&&jm>=1&&!obj.d){obj.d=true;dlg("PARLAMENT PROCISTEN!","Dokumenty o VLASTIZRADE zajisteny! Psychotronicky rusic ZNICEN! Do PODZEMI!")}
}else if(lv===5){
let dc=its.filter(i=>i.tp==='doc'&&i.col).length;
let ag=npcs.filter(n=>n.isA&&n.rev).length;
if(dc>=2&&ag>=2&&!obj.d){obj.d=true;dlg("PODZEMI PROHLEDANO!","Tajne dokumenty nalezeny! Agenti ODHALENI! Nyni do CENTRALY GRU!")}
}else if(lv===6){
let boss=ens.filter(e=>e.tp==='boss'&&!e.al).length;
if(boss>=1&&!obj.d){obj.d=true;st='victory';
dlg("VITEZSTVI!!!","AGENTI GRU A KGB JSOU ODHALENI!!! Cely SEZNAM je na www.cibulka.net! VOLTE PRAVY BLOK! Prectete si knihu 'Jak ziskavat informace z jemnohmotneho sveta' od Alexandra Svijase! BOJ NIKDY NEKONCI!!!")}
}}

// === PLAYER ===
function mkP(x,y){return{x,y,w:30,h:50,vx:0,vy:0,jp:true,hp:100,inv:0,fr:true}}
function updP(){
if(P.inv>0)P.inv--;
if(K['ArrowLeft']){P.vx=-PS;P.fr=false}
else if(K['ArrowRight']){P.vx=PS;P.fr=true}
else P.vx=0;
if(ck('Space')&&!P.jp){P.vy=JV;P.jp=true}
P.vy+=GR;P.x+=P.vx;P.y+=P.vy;
P.jp=true;
plats.forEach(p=>{if(col(P,p)){
if(P.vy>0&&P.y+P.h-P.vy<=p.y+4){P.y=p.y-P.h;P.vy=0;P.jp=false}
else if(P.vy<0&&P.y-P.vy>=p.y+p.h-4){P.y=p.y+p.h;P.vy=1}
else if(P.vx>0&&P.x+P.w-P.vx<=p.x){P.x=p.x-P.w}
else if(P.vx<0&&P.x-P.vx>=p.x+p.w){P.x=p.x+p.w}
}});
if(P.x<0)P.x=0;if(P.x+P.w>lvW)P.x=lvW-P.w;
if(P.y>H+100)hurt(999);
if(ck('KeyE')){if(cd){cdlg()}else tryInt()}
if(ck('KeyK'))tryKyv();
}
function hurt(d){if(P.inv>0)return;P.hp-=d;P.inv=30;sp(P.x+P.w/2,P.y+P.h/2,'#ff0000',5);if(P.hp<=0){P.hp=0;st='dead';dtmr=90}}
function tryInt(){
npcs.forEach(n=>{if(n.fled||n.rev)return;
let dx=Math.abs(P.x+P.w/2-n.x-n.w/2),dy=Math.abs(P.y+P.h/2-n.y-n.h/2);
if(dx<80&&dy<60&&n.dlg&&!n.int){n.int=true;dlg(n.dlg.t,n.dlg.tx,n.dlg.cb)}})
}

// === ENEMIES ===
function updEn(){
ens.forEach(e=>{if(!e.al)return;
e.x+=e.dr*e.sp;if(e.x>e.ex){e.x=e.ex;e.dr=-1}if(e.x<e.sx){e.x=e.sx;e.dr=1}
if(e.tp==='gru'||e.tp==='boss'||e.tp==='mb'){
e.cd--;if(e.cd<=0){let dx=P.x-e.x;let sd=dx>0?1:-1;
projs.push({x:e.x+e.w/2,y:e.y+e.h/2-5,vx:sd*(e.tp==='boss'?5:4),vy:0,w:10,h:8,en:true,dm:e.tp==='boss'?12:8});
e.cd=e.cdm}}
if(e.tp==='boss'&&e.ph){let r=e.hp/e.mhp;if(r<.33&&e.ph!==3){e.ph=3;e.sp=4;e.cdm=40}else if(r<.66&&e.ph<2){e.ph=2;e.sp=3;e.cdm=60}}
if(col(P,e)){if(P.vy>0&&P.y+P.h-P.vy<=e.y+8){P.vy=-8;
if(e.tp==='boss'){e.hp-=25;score+=50;sp(e.x+e.w/2,e.y,'#ffcc00',10);if(e.hp<=0){e.al=false;score+=500;sp(e.x+e.w/2,e.y+e.h/2,'#ff0000',30);chkObj()}}
else if(e.tp==='mb'){e.hp-=30;score+=30;sp(e.x+e.w/2,e.y,'#ffcc00',8);if(e.hp<=0){e.al=false;score+=300;sp(e.x+e.w/2,e.y+e.h/2,'#ff0000',20);chkObj()}}
else{e.al=false;score+=100;P.vy=-6;sp(e.x+e.w/2,e.y+e.h/2,'#ff4444',10);chkObj()}}
else hurt(e.tp==='boss'?15:8)}});
for(let i=projs.length-1;i>=0;i--){let p=projs[i];p.x+=p.vx;p.y+=p.vy;
if(p.x<cam.x-50||p.x>cam.x+W+50){projs.splice(i,1);continue}
if(p.en&&col(P,p)){hurt(p.dm);projs.splice(i,1)}}
ens=ens.filter(e=>e.al)}

// === ITEMS ===
function updIt(){
its.forEach(it=>{if(it.col)return;
if(it.tp==='loud'||it.tp==='press'||it.tp==='jam'){
if(col(P,it)&&P.vy>0&&P.y+P.h-P.vy<=it.y+4){it.col=true;P.vy=-8;score+=(it.tp==='jam'?500:100);
sp(it.x+it.w/2,it.y,it.tp==='jam'?'#cc00cc':'#888',12);
if(it.tp==='jam')dlg("USPECH!","Znicil jsi PSYCHOTRONICKY RUSIC GRU! Mysl pritomnych je OSVOBOZENA!");
chkObj()}
if(it.tp==='jam'&&!it.col){let d=Math.abs(P.x+P.w/2-it.x-it.w/2);if(d<300)hurt(.06)}
return}
if(col(P,it)){it.col=true;
if(it.tp==='hp'){P.hp=Math.min(100,P.hp+25);sp(it.x,it.y,'#00ff00',8)}
else if(it.tp==='kyv'){hasKyv=true;sp(it.x,it.y,'#ffcc00',15);
dlg("SIDERICKE KYVADLO!","NASEL jsem sve SIDERICKE KYVADLO! Tento nastroj mi umoznuje spojit se s JEMNOHMOTNYM SVETEM a ODHALIT AGENTY! Stiskni K pobliz podezrele osoby! Prectete si 'Jak ziskavat informace z jemnohmotneho sveta' od Alexandra Svijase!")}
else{score+=50;sp(it.x,it.y,'#ffff00',6)}
chkObj()}});
hzs.forEach(hz=>{if(col(P,hz))hurt(hz.dm)});
exs.forEach(ex=>{if(col(P,ex)&&obj.d){st='levelEnd';letmr=60}})}

// === CAMERA ===
function updCam(){let t=P.x-W/2+P.w/2;cam.x+=(t-cam.x)*.1;if(cam.x<0)cam.x=0;if(cam.x>lvW-W)cam.x=lvW-W}

// === RENDER ===
function render(){
X.clearRect(0,0,W,H);let cx=Math.floor(cam.x);
// BG
let bg=['#1a1008','#121225','#0f1a0f','#15151a','#1a0505','#0a0a15','#0f0808'];
X.fillStyle=bg[lv]||'#111';X.fillRect(0,0,W,H);
X.globalAlpha=.12;X.fillStyle='#fff';
for(let i=0;i<15;i++){let bx=((i*137+lv*50)%(lvW+200))-cx*.3,by=(i*73+lv*30)%H;X.fillRect(bx,by,2,2)}
X.globalAlpha=1;
if(lv===3){X.fillStyle='#0a2040';X.fillRect(0,H-50,W,50);X.fillStyle='#0e3060';for(let i=0;i<20;i++){let wx=(i*50+fr*.5)%(W+100)-50;X.fillRect(wx,H-30+Math.sin(fr*.03+i)*5,40,3)}}
X.save();X.translate(-cx,0);
// Plats
let pc=['#6b4226','#555','#3a3a3a','#8a7a5a','#4a0000','#2a2a2a','#1a1a1a'];
plats.forEach(p=>{X.fillStyle=pc[lv]||'#8B4513';X.fillRect(p.x,p.y,p.w,p.h);X.fillStyle='rgba(255,255,255,.1)';X.fillRect(p.x,p.y,p.w,2)});
// Hazards
hzs.forEach(hz=>{X.fillStyle='#ff3333';X.globalAlpha=.6+Math.sin(fr*.1)*.2;X.fillRect(hz.x,hz.y,hz.w,hz.h);X.globalAlpha=1});
// Items
its.forEach(it=>{if(it.col)return;
if(it.tp==='kyv'){X.fillStyle='#ffcc00';let b=Math.sin(fr*.08)*4;X.fillRect(it.x,it.y+b,it.w,it.h);X.fillStyle='rgba(255,204,0,.3)';X.fillRect(it.x-4,it.y+b-4,it.w+8,it.h+8)}
else if(it.tp==='loud'||it.tp==='press'){X.fillStyle='#666';X.fillRect(it.x,it.y,it.w,it.h);X.fillStyle='#f00';X.fillRect(it.x+2,it.y+2,6,6)}
else if(it.tp==='jam'){X.fillStyle='#cc00cc';X.globalAlpha=.5+Math.abs(Math.sin(fr*.05))*.5;X.fillRect(it.x,it.y,it.w,it.h);X.globalAlpha=1}
else if(it.tp==='doc'){X.fillStyle='#00cccc';X.fillRect(it.x,it.y,it.w,it.h)}
else if(it.tp==='hp'){X.fillStyle='#fff';X.fillRect(it.x,it.y,it.w,it.h);X.fillStyle='#f00';X.font='14px Courier New';X.fillText('+',it.x+4,it.y+14)}
else{X.fillStyle='#ffff00';let b=Math.sin(fr*.06+it.x)*3;X.fillRect(it.x,it.y+b,it.w,it.h)}});
// Exits
exs.forEach(ex=>{X.fillStyle=obj.d?'#00cc00':'#b38f00';X.globalAlpha=obj.d?.6+Math.sin(fr*.08)*.3:.4;X.fillRect(ex.x,ex.y,ex.w,ex.h);X.globalAlpha=1;X.fillStyle='#000';X.font='bold 11px Courier New';X.textAlign='center';X.fillText(obj.d?'DALE':'zamceno',ex.x+ex.w/2,ex.y+ex.h/2+4);X.textAlign='left'});
// NPCs
npcs.forEach(n=>{if(n.fled)return;X.fillStyle=n.rev?(n.isA?'#cc0000':'#00cc00'):'#3366cc';X.fillRect(n.x,n.y,n.w,n.h);
if(!n.rev&&!n.int){X.fillStyle='#ff0';X.font='18px Courier New';X.textAlign='center';X.fillText('?',n.x+n.w/2,n.y-8);X.textAlign='left'}
if(n.rev&&!n.isA){X.fillStyle='#0f0';X.font='14px Courier New';X.textAlign='center';X.fillText('\u2713',n.x+n.w/2,n.y-6);X.textAlign='left'}});
// Enemies
ens.forEach(e=>{if(!e.al)return;let ec={'gru':'#cc0000','man':'#7700aa','pol':'#cc8800','boss':'#440000','mb':'#883300'};
X.fillStyle=ec[e.tp]||'#cc0000';
if(e.tp==='boss'||e.tp==='mb'){X.globalAlpha=.8;X.fillRect(e.x,e.y,e.w,e.h);X.globalAlpha=1;X.fillStyle='#333';X.fillRect(e.x-5,e.y-10,e.w+10,6);X.fillStyle='#f00';X.fillRect(e.x-5,e.y-10,(e.w+10)*(e.hp/e.mhp),6)}
else X.fillRect(e.x,e.y,e.w,e.h)});
// Projectiles
projs.forEach(p=>{X.fillStyle='#ff4444';X.fillRect(p.x,p.y,p.w,p.h)});
// Player
if(st!=='dead'||fr%8<4){X.fillStyle='#00cc00';if(P.inv>0&&fr%6<3)X.globalAlpha=.4;X.fillRect(P.x,P.y,P.w,P.h);X.globalAlpha=1;
X.fillStyle='#000';let ex=P.fr?P.x+18:P.x+6;X.fillRect(ex,P.y+10,5,5);
if(hasKyv){X.fillStyle='#ffcc00';X.fillRect(P.x+P.w/2-3,P.y-8,6,6)}}
// Particles
parts.forEach(p=>{X.fillStyle=p.c;X.globalAlpha=p.l/60;X.fillRect(p.x,p.y,p.s,p.s)});X.globalAlpha=1;
X.restore();
if(cd)renderDlg();if(kvs)renderKyv()}

function renderDlg(){
X.fillStyle='rgba(0,0,0,.85)';X.fillRect(60,H/2-110,W-120,220);X.strokeStyle='#ffcc00';X.lineWidth=2;X.strokeRect(60,H/2-110,W-120,220);
X.fillStyle='#ffcc00';X.font='bold 16px Courier New';X.textAlign='center';X.fillText(cd.t,W/2,H/2-80);
X.fillStyle='#fff';X.font='13px Courier New';wt(cd.tx,W/2,H/2-52,W-180,17);
X.fillStyle='#888';X.font='11px Courier New';X.fillText('[ E = pokracovat ]',W/2,H/2+95);X.textAlign='left'}

function renderKyv(){
X.fillStyle='rgba(0,0,0,.7)';X.fillRect(W/2-100,50,200,200);X.strokeStyle='#ffcc00';X.lineWidth=2;X.strokeRect(W/2-100,50,200,200);
X.fillStyle='#ffcc00';X.font='bold 13px Courier New';X.textAlign='center';X.fillText('SIDERICKE KYVADLO',W/2,72);
let pr=1-(kvs.tmr/120),px=W/2,py=100,an;
if(pr<.7)an=Math.sin(pr*20)*(1-pr)*.5;else an=kvs.res?-.4:.4;
let bx=px+Math.sin(an)*80,by=py+Math.cos(an)*80;
X.strokeStyle='#ffcc00';X.lineWidth=2;X.beginPath();X.moveTo(px,py);X.lineTo(bx,by);X.stroke();
let bc=pr<.7?'#ffcc00':(kvs.res?'#ff0000':'#00ff00');X.fillStyle=bc;X.beginPath();X.arc(bx,by,10,0,Math.PI*2);X.fill();
if(pr>=.7){X.font='bold 15px Courier New';X.fillStyle=kvs.res?'#f00':'#0f0';X.fillText(kvs.res?'AGENT!':'CISTY',W/2,220)}
else{X.font='12px Courier New';X.fillStyle='#ccc';X.fillText('Spojuji se s jemnohmotnym svetem...',W/2,220)}
X.textAlign='left'}

function wt(tx,x,y,mw,lh){let w=tx.split(' '),l='';for(let i=0;i<w.length;i++){let t=l+w[i]+' ';if(X.measureText(t).width>mw&&i>0){X.fillText(l,x,y);l=w[i]+' ';y+=lh}else l=t}X.fillText(l,x,y)}

// === HUD ===
function updHUD(){let h='';for(let i=0;i<lives;i++)h+='\u2665';document.getElementById('hl').textContent=h||'\u2620';
document.getElementById('hh').textContent='ZDRAVI: '+Math.ceil(P.hp)+'%';
document.getElementById('hs').textContent='SKORE: '+score;
document.getElementById('ho').textContent=obj.t+(obj.d?' \u2713':'')}

// === LEVELS ===
function loadLv(n){
lv=n;plats=[];ens=[];npcs=[];its=[];exs=[];hzs=[];projs=[];parts=[];cd=null;dq=[];kvs=null;obj={t:'',d:false};
P=mkP(50,500);
if(n===0)lv0();else if(n===1)lv1();else if(n===2)lv2();else if(n===3)lv3();else if(n===4)lv4();else if(n===5)lv5();else if(n===6)lv6();
st='playing'}

function lv0(){ // Cibulkuv byt - Tutorial
lvW=800;
plats.push({x:0,y:580,w:800,h:20},{x:100,y:480,w:150,h:16},{x:350,y:420,w:120,h:16},{x:550,y:350,w:150,h:16},{x:200,y:300,w:100,h:16});
